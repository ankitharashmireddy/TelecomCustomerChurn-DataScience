services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: telecom-churn-app:1.0
    container_name: telecom-churn-web
    ports:
      - "5001:5000"
    environment:
      SECRET_KEY: ${SECRET_KEY}
    volumes:
      - churn_data:/app/data
    restart: unless-stopped

volumes:
  churn_data: